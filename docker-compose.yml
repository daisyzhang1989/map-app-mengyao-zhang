services:
  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      BACKEND_API_BASE_URL: http://backend:3001
    depends_on:
      - backend

  backend:
    build: ./backend
    expose:
      - "3001"
    environment:
      PORT: 3001
      DATABASE_URL: postgres://postgres:postgres@db:5432/mapapp
    depends_on:
      - db

  db:
    image: postgis/postgis:16-3.4
    container_name: map-app-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mapapp
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: